    <style>
        /* The page is sparser than the sub-page register: no work-header, no
           nav, no body prose. Only the two Dante lines and the drawing. */
        body.false-cows main {
            max-width: 720px;
            padding-top: 8vh;
            padding-bottom: 8vh;
        }
        .fc-quote {
            font-family: var(--font-display);
            font-style: italic;
            font-size: clamp(1.1rem, 2.4vw, 1.55rem);
            line-height: 1.45;
            color: var(--text-heading);
            text-align: center;
            margin: 0;
            letter-spacing: 0.005em;
        }
        .fc-quote.top    { margin-bottom: 3.2rem; }
        .fc-quote.bottom { margin-top: 3.2rem; }
        .fc-drawing {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            background-image: url('false-cows-dark.png');
        }
        [data-theme="day"] .fc-drawing {
            background-image: url('false-cows-light.png');
        }
        .fc-back {
            position: fixed;
            top: 24px;
            left: 24px;
            font-family: var(--font-display);
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            opacity: 0.55;
            text-decoration: none;
            background: none;
            transition: opacity 0.4s ease, color 0.3s ease;
        }
        .fc-back::before {
            content: '\2190';
            margin-right: 0.5em;
            color: var(--accent-dim);
        }
        .fc-back:hover {
            opacity: 1;
            color: var(--text-primary);
            background: none;
        }
    </style>
</head>
<body class="false-cows">

    <main>
        <p class="fc-quote top">e quando vide noi, s&eacute; stesso morse</p>

        <p class="fc-quote bottom">s&igrave; come quei cui l&rsquo;ira dentro fiacca</p>
    </main>
