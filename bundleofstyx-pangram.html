<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pangram's AI detector reads a passage of mine. Verdict attached.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Bundle of Styx · Pangram report – Edith Mina Lyre">
    <meta property="og:description" content="Pangram's AI detector reads a passage of mine. Verdict attached.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://edithminalyre.com/bundleofstyx-pangram">
    <link rel="canonical" href="https://edithminalyre.com/bundleofstyx-pangram">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <title>Bundle of Styx · Pangram report – Edith Mina Lyre</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .pdf-viewer { margin: 2.2em 0 0; }
        .pdf-viewer summary {
            list-style: none;
            cursor: pointer;
            display: block;
            position: relative;
            border: 1px solid var(--border);
            background: var(--bg-card);
            padding: 0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }
        .pdf-viewer summary::-webkit-details-marker { display: none; }
        .pdf-viewer summary::marker { content: ''; }
        .pdf-viewer summary:hover {
            border-color: var(--accent);
            box-shadow: 0 0 60px var(--glow-color);
            transform: translateY(-2px);
        }
        .pdf-thumb {
            display: block;
            width: 100%;
            height: auto;
        }
        .pdf-hint {
            display: block;
            font-family: var(--font-display);
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            text-transform: lowercase;
            color: var(--accent);
            text-align: center;
            padding: 0.9em 0 1.1em;
            border-top: 1px solid var(--border);
        }
        .pdf-viewer[open] summary { display: none; }
        .pdf-frame {
            display: block;
            width: 100%;
            height: 85vh;
            min-height: 600px;
            border: 1px solid var(--border);
            background: var(--bg-card);
        }
        .pdf-fallback {
            margin-top: 1em;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
        .pdf-fallback a { color: var(--accent); }
        .lede {
            font-style: italic;
            color: var(--text-secondary);
            margin: 1.4em 0 0.4em;
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="cursor-glow" id="glow"></div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <main>
        <a href="index.html" class="back">Edith Mina Lyre</a>

        <h1>Bundle of Styx</h1>
        <p class="lede">Pangram's AI detector reads a passage of mine. Verdict attached.</p>

        <details class="pdf-viewer">
            <summary aria-label="Open Pangram AI report inline">
                <img class="pdf-thumb"
                     src="pangram-thumb.jpg"
                     alt="First page of the Pangram AI detection report: verdict reads 100% AI Generated."
                     loading="lazy">
                <span class="pdf-hint">click to read inline</span>
            </summary>
            <iframe class="pdf-frame"
                    src="Pangram%20AI%20report%202026-05-25.pdf#view=FitH"
                    title="Pangram AI Detection Report, 25 May 2026"
                    loading="lazy"></iframe>
            <p class="pdf-fallback">PDF not loading? <a href="Pangram%20AI%20report%202026-05-25.pdf" target="_blank" rel="noopener">Open in a new tab.</a></p>
        </details>
    </main>

    <script>
        (function(){
            var btn = document.getElementById('themeToggle');
            var saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
            if (btn) btn.addEventListener('click', function(){
                var current = document.documentElement.getAttribute('data-theme') === 'day' ? 'day' : 'night';
                var next = current === 'day' ? 'night' : 'day';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        })();
    </script>
</body>
</html>
