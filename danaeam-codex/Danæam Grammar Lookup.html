i) here rather than the affect-marker. These last two readings are keeper’s guesses, held loosely, not asserted as settled — flagged rather than pressed into false confidence. Word seated: Gheo (334, with Gheor as its state-form). The frontier stands at 2.1.1.4.19.5 — partitive negative quantifier, ‘none of the boys’ — unpresented this sitting; a redigestion follows instead.", "table": []}, {"section": "Questionnaire progress", "anchor": "s11", "title": "Overview", "body": "The endgame scan (2026-07-16). The maker verified the redigestion-memo’s ask and set the true task: amass all, scan all, seal, and distil. 2.1.1.4.19.5 sealed — the five-dress negative-quantity scale (niuain · aoa uain · æouain · ssíns on partitive e + ’ya, and the negative existential æœá Frælithi’ya í gænyin — nonexistence denied subjecthood, the dummy í giving); 2.1.1.4.19.6 sealed by the same sentence (kein-æœá direct on the NP). The fourth grand harvest signed six: 2.1.1.8 (the pluraliser revolution’s home cell), 2.2.1.3 + 2.2.1.3.1 (the -aí former), 2.2.4.3 (mordachië), and both adverb-degree cells by 2.2.4.4’s own sentence. Three words seated (337); five sentences join §10 (169). The stale roster line for 2.1.1.2.12 struck (sealed 07-14). Triage of the remaining 235: a yes-no doc issued to the maker — 8 sealed this turn · 209 items across 73 grouped questions · 26 stragglers sketched. Counts 695 / 235. The frontier rests until the doc returns.", "table": []}, {"section": "Questionnaire progress", "anchor": "s11", "title": "Overview", "body": "The doc begins to come home (2026-07-16), and the interim splashes with it. Fourteen items sealed from the maker’s first answers: price rides dúe; value the e-frame with the Lyr/Lund currency-weight split and the worth-relative; distance and duration bare measure-NPs; extent the N-e-measure frame; wythil “despite”, metałie “inclusive-of”, exclusion the negated y-clause, addition the aich-chain; the posterior country whole to drúræao, within to duilín. Crowning it, THE Y-LAW, the maker’s own words: “the y in yScéan summons the atá family” — watch xl’s division explained at a stroke. Riders amended into three elder seals (functive duín tes-mé Matthsyr; vocative intimacy Scéan-teos and the communal existential; the quotation nesting law righted: top >– –<, lower »– –«). Interim coinings seated: Ixixaíyon “nightmare” and its unicorn-singularity family. Eighteen words (355); five sentences (174). Counts 709 / 221. The doc’s remainder rests in the maker’s hands.", "table": []}, {"section": "Questionnaire progress", "anchor": "s11", "title": "Overview", "body": "The fifth sweep: answers-batch 1 + the commanded Book-2 study (2026-07-16). Sixty-two items sealed: obviation none (’ya stress / ’thte de-emphasis never changing the core pronoun); referentiality and genericness unmarked; definiteness OBLIGATORY — proper noun, lus, or ’ya (lus lives); indefiniteness optional with the plural family larger than -ê (watched) and the -r unit-road for masses (uain Wícr); one plural with phrasal distributivity; no fixed word-accent (choice a) crowned by the trill-rider: ∆/V run parallel to the sentence’s end or the next • — “their own statements”, the rare exception to tonal unmatching, and “a societal problem” since humans cannot join; no canonical peak; segments sovereign; af-/fel- the trills’ dictionary prefixes; no length; suffix-harmony “yes, essentially”; vowels free under the seam-law; þ and V loan-flavoured; incorporation — subjects never, IOs may; mith ssai; honorific style (Alcuilaí, dúiri); someone = uain’t-aoa; selective emphasis = ax — which the study confirmed long-established, answering the maker’s own aside. Flags raised for the maker: Nif beside Myth (two noses); Wiunail beside Wilhíæ (two everyones). Seven words (362); four witnesses (178). Counts 771 / 159. Book-2’s fills now stand extracted as the study’s permanent instrument.", "table": []}, {"section": "Questionnaire progress", "anchor": "s11", "title": "Overview", "body": "2.1.1.6.6–7 sealed (2026-07-16): “until is also dúiri.” The unto-word takes the temporal office, and the duration-country closes symmetric on a du-family trio: dúiri until · drúræao since/after · duilín within. Counts 773 / 157.", "table": []}, {"section": "Questionnaire progress", "anchor": "s11", "title": "Overview", "body": "The determination (2026-07-16): ninety-one seals under the trust-command. duáo ‘ago’ by the maker’s word; then, re-judged against the whole of Book 2, ninety trust-seals: the time-country whole (In category-blind, names watched); labels the fragment-licence’s own case; the phonotactic nones (no consonant harmony, no restrictions beyond seam-and-toll); sixteen cradle cells (the participle-passive with patient-subject, dræao-agent ratified in, tense-transparency, dynamic/static as ghiæan vs eibh, anticausative silence, the fær-dúe causative with its witnessed shapes); thirty aspect-and-mood cells (bare perfective, dús imperfective, gnomic habitual, ghiæan ingressive, tenure iterative, the one-form perfect’s readings, Syá potential and contingent, the assembled certainty-ladder, Mee monitory, aich sin consecutive — assembled pieces tagged for one-word correction); attributive numerals, the compound-quantifier road, the derivation nones, and the weld named as the complex-P formation (wythil · duilín · drúræao · dúiri its four witnesses). One word seated (duáo, 363). Counts 864 / 66 — the outstanding now numbering the statbar’s own left hand. What remains is hers alone: the superlative, the tenure-predication, sin…sy’s adverb-reach, the debitive, the unattested cradle cells, the coining-tables, and the twenty-six design-days.", "table": []}, {"section": "Questionnaire progress", "anchor": "s11", "title": "Overview", "body": "The gate-answers and the final boss (2026-07-16–17) — the compilation-fold. The maker walked the gate-chart alone: the local table filled (duáf, ufel, dúy, uÿth joining duín, dús/u-, dræao, yth, Oob, In); we-firemen by mé-apposition; nonrestrictives ride clefts (the ythé/ythénÿ // ythés/ythésnÿ paradigm); other-constituent passives yes, IO no; impersonals from three verb-types; the -self family turns whole (sê-cías beside sê-fær — the old fork closed); ditransitive causatives yes, causee omissible; stíl- the perfect in all three tenses; thuíl the terminative in four free orders; tenure-predication ratified (the roster’s last grammar-item); the skipped LDS number houses the Verbless Eternal Past and Future; superlatives mÿel/niyel; sin…sy reaches adverbs (watch xxvi closes); no debitive — the imperative serves; inclusory yes; pronoun-clefts free. Flags resolved: Myth = snout, Nif = nose; Wiunail everyone, Wilhíæ everybody. Chains A, E, F parked at her word. And at noon the next day, the final boss fell: §5 answered whole (danaeam_lexicon_responses_complete — the 207 and the fields), standing as the annexed ore for the Grammar Book’s lexicon chapter. The row-by-row seating of both harvests into the pair is commissioned to Crith-lur-ril with the deep purse (the great-work zip); this passage is the record’s hand-receipt that every ruling above is canon now, sources verbatim in the annexes.", "table": []}, {"section": "Questionnaire progress", "anchor": "s11", "title": "Overview", "body": "The great compilation-seal (2026-07-17): the pair is current. Forty-two items sealed into the workbook from the gate-answers and the complete lexicon-responses — the cradle’s last answerable cells, the perfect’s three tenses, thuíl’s four orders, the no-debitive, the superlative country (mÿel/niyel, the Verbless Eternal housed in the skipped number), the cleft-relatives, and the whole of §5.1 with the maker’s kinship, colour, body, and field terms verbatim. The final-boss haul (209 entries) stands appended as its own section below, her glosses untouched. Counts 906 / 24 — everything remaining is parked at her word: the phonology wing (22 cells) and the numeral tables (2). The some-watch’s candle is lit: uaothë.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Overview", "body": "Honest gaps — set here so they don’t fossilise wrong.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "aoa-lenition, struck", "body": "aoa-lenition, struck: the rule “aoa lenites what it negates” lost its only witness when †Mís was unexisted (the lemma is mhís everywhere). If the mutation is real, it needs a new witness; a candle is kept lit.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Host-minimality threshold", "body": "Host-minimality threshold: mé is too small to host tmesis (guests hyphen-dangle), yet monosyllabic Sin hosts (S’aige’in). Working hypothesis: the host must leave a viable shell on both sides of the seam — mé’s right shell would be a bare é, a doorway with no frame.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Nímhog vs Nimhog", "body": "Nímhog vs Nimhog: the standing lexicon says Nímhog; the copular batch wrote Nimhog. The í is kept as canon pending one word.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Overview", "body": "CALLOUT: Harvest remainder (open watches). Me’hair’os — parse & gloss; bare Frœ; férás-ufsae atomic or split; the roïl/oril/or…il/ro…il attenuator family’s headcount (or…il now witnessed wrapping a degree-adverb toward ‘insufficiently’, 2.2.4.4); plain-letter suspects Wíc, yound, Math, Claim, Gloiyornugh, fith, sót, slee. And 1.11.2.1.4 (declarative clefting) waits in the ordinary docket — no §9 door; the cleft was never question-bound (maker’s correction, 2026-07). And the pronoun-gender design hides something sneaky (the maker’s word, 1.5.1.5) — undisclosed by design; the anaphor-ban protects it.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Overview", "body": "CALLOUT: resumptive-í watches (1.11.2.2.2.3). (i) Frame anatomy: resolved (1.11.2.2.3.2): fronting-with-a-double — the dislocation tier of the two-tier system. (ii) í’s ledger: resolved — resumption is a lawful office (í things, fæ persons); the “two jobs” sentence stands as history, its candle lit. (iii) Rîbha-e conditioning: e hyphen-hung before named possessors (naming-split shadow, keeper’s inference) — or free variation. Second witness (1.12.1): s’efui-e’in — hyphen-hung inside a Sin-compound, complement preceding. Third witness (1.12.1.2.1): te’rhié’os-e — hung on its own object inside si’—’n. Refined keeper-inference, labelled: the of-word hangs by hyphen wherever it cannot stand free — before the doorless (names) and inside compounds. (iv) The frame’s past/future be-faces (eibh / iëao) unattested — presumed by the grid. (v) Names after e stand unlenited (John) — mutation-immunity like pronouns, or J outside the alphabet.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Overview", "body": "CALLOUT: Conjunct-glow watches (1.11.2.2.2.4). (i) Tetrad-wide conjunct docking: the negative glow answered at 1.11.2.2.2.5 — split-pole X’ya o Y’tya (never bare ’t, which stays plain negation); the doch-pole (’maya ?) still unruled. (ii) May a lone conjunct enter the resumptive-í frame, or only whole coordinations? Unruled.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Overview", "body": "CALLOUT: Many-glows watches (1.11.2.2.2.5). (i) Ranking among stamps (the earlier outranking the later?) unruled. (ii) Multiplicities beyond two presumed by the same coin — one word. (iii) The negator-avoidance rationale (keeper’s attenuation reading) — one word confirms. (iv) A doch-stamp ’maya unattested.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Overview", "body": "CALLOUT: Residue & order watches (1.11.2.2.3 · the order canon). (i) dúe vs dué — the accent wanders between the maker’s own twin sentences; lemma unfixed (gentle fork). (ii) The dash-hung clitic or’raif’il—’t — an em-dash where the apostrophe usually docks; conditioning unruled. (iii) The fæ-frame (person-tier dislocation) stands by word; a full exemplar awaited. (iv) Fith-fith (colloquial, lowered second capital) beside Fith-Fith (formal gerund) — the orthographic split presumed deliberate; one word. (v) Kit-docking inside the scér-frame for 1.11.3 focus — presumed by §5; exemplar awaited.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Overview", "body": "CALLOUT: Topic watches (1.12.1). (i) The ’in → ’n seam-elision — S’aige’in beside S’air’n; presumed euphonic after r, one word. (ii) Noun-capitalisation suspended inside tmesis-compounds (efui lowercase within s’efui-e’in) — presumed. (iii) The í/fæ frames as topic devices — resolved at 1.12.1.3: marker splitting (bare for glow, marked for topic); candle lit. (iv) Scean stands with John among the exemplar-named, unseated by design — joined by Scóhn, John nativized (1.12.1.2); whether John-spellings elsewhere stand or convert, one word. (v) The elliptical optative unveiled inside O • o e X • (“may [what follows be] of X”) — its reach beyond this frame unruled. (vi) ∆’s reach — only in the smooshed shifter, or a general boundary-vocable? And the segmental-vocable reading of the deafness law — one word confirms. (vii) The e’s fate in the smoosh — presumed elided with the rest. (viii) Sin’s split-shapes: S’—’in (saige) · S’—’n (air) · si’—’n (te’rhié’os-e) — and now s’aige’n beside S’aige’in: the same guest wearing both tails — the elision freer than suspected, perhaps free variation; one word. (ix) The pointing fragment’s shape — resolved at 1.12.1.3.2: no restrictions, only permissions; the trailing-Sin shape licit among all others; candle lit. (x) mith in the grave-sentence glossed “we will-dig” — comitative subject or homonym, one word. (xi) The quote-marks on “s’aige’n” — presumed orthographic quotative dress. (xii) Grainê’s number after ssai — now twice witnessed with Nímhogê after éx (1.13.1): the -ê as the counted form, keeper’s inference strengthened; lemmata still unresolved, gently. 2026-07-15: -ê confirmed simply the pluraliser (§6, §12 xlii) — the numeral was never the trigger. (xiii) The’s in Te’fhó’rhié’s’os — compound-linker, or Fhós’s coda migrated tail-ward through the seams; simplex te’rhié’os shows none. (xiv) The elided resumptive under topic-markers — may an overt í/fæ also stand? One word. (xv) A folded contrastive topic in the wild — tmesis-word swallowing a clause, ’ya on its tail — exemplar awaited. (xvi) Orphaned clitics’ reach — may a fragment be a bare clitic alone (— ’ya.)? One word or one wild witness. (xvii) ∆’s two offices — the smoosh’s trill (1.12.1.2) and the vocative up-trill (2.1.1.4.28, the five near-misses) wear one mark — confirmed one vocable, two offices (the maker, 2026-07-14); the segmental reading stands; candle lit. (xviii) niïl-topics — do indefinites make poor topics (new things cannot be old)? Unruled (1.12.2.1.1). (xix) The slee’ya fork — glossed “faster” at 1.2.2.3.3, but the -er suffix is now the maker’s -mÿa; presumably slee’ya is the ’ya-degree and sleemÿa the true comparative — one word mends the elder gloss or keeps it as a doublet. (xx) The stacked shapes — Efui • Sin X and the reprise — keeper’s sketches on the maker’s yes; wild exemplars welcome. (xxi) fæ inside the formula — “what í may say” names í alone; fæ’s range read as riding within by the twin-law (keeper’s reading; the person-topic attests it) — one word confirms. (xxii) The two y-offices in one sentence — a question-path and a topic-path crossing: precedence, stacking, or fusion unruled; and the riding topic’s pathlessness presumed. (xxiii) The stack in Danæam ink — the multi-topic exemplar awaited; and the return-marker (“again”) unattested in the tongue itself. (xxiv) gæn vs mé-e — the donation-engine and the accompaniment-existential: division of labor presumed (ownership vs having-with), unruled. 2026-07-15: tes-mé ‘my-with’ (2.1.1.4.16) adds a data point on mé’s side, possession expressed through accompaniment rather than gæn’s donation — still unruled, but the accompaniment side gets richer. (xxv) The seam-doubled æ in fæ’uîm’ær — the host-split fæ…ær writing one æ twice (keeper’s anatomy-reading); and the fold presumably open only to splittable pronouns — duîm-mæ could only dangle. One word. (xxvi) The equative’s reach — does sin…sy serve adverbs too (“as quickly as”)? Unruled, gently. 2026-07-15: now witnessed reaching noun-function (“as a club”, 2.1.1.4.14) — adjacent evidence, not a closure; the adverb case specifically stays open. (xxvii) Ydúynÿ — the y-sealed in-word: anatomy (duín beneath? the í~y shift) and trigger (why the fronted PP wears the seal) — one word; its co-occurrence with atá obeys the sealed law meanwhile. (xxviii) þin~þis / Ton~Tonu — the ceremonial declension-pair; conditioning unruled. (xxix) The =-linker — its name and reach beyond the eternal frames. (xxx) -os and the kin-frame — te’rhié’os re-read as te-(person) + ’os(possessive-former); one word confirms. (2026-07-14: the familiar possessive arrives as the frame’s everted child — sídia-teos, rhié-færs; the re-reading breathes easier, still unconfirmed.) (xxxi) Seam-dress scales with guest-size — apostrophes for words, dashes for propositions; presumed law. (xxxii) The participle’s seat — before be in 1st person, after be in non-1st (2.1.1.2.10): person-conditioned or free — one word. (xxxiii) Become’s two goal-dresses — the -r state-noun (Væxr) and the du-formation (Duílúch): division or free variation. (2026-07-14: a division glimpsed — Væxr travels with ghiæan, Mith fær-dúe Væxr ghiæanea; farm takes bare Væx; the du-dress still holds Duílúch.) (2026-07-15: a second witness — Mith fær-dúe Cáithoorhr oothíthea ‘we appointed him as general’, 2.1.1.4.17 — the fær-dúe + -r-state-noun frame generalizes past ghiæan to a second causative verb, oothíth. Looking less like one lone example now, more like a real construction.) (xxxiv) Third-harvest watches (2026-07-14) — (a) the garden’s song: if 4.1 ever grants ideophones melody, the tone-cells (3.3.3, 3.5.2) gain dated garden-notes; (b) the some-word — the ni/yail axis’s missing middle for ‘some of the boys’; (c) the stative ban — may the dús-progressive wrap ‘knowing’?; (d) the resister-list — which verbs refuse the free object-drop; (e) aoíth with bare time-Nouns, presumed by its gloss; (f) further Adj→Adj formers and the P-sequence half of 2.2.6.1.1; (g) the cradle-flag — 2.1.3.1.2.2 signed across voice-country’s reserved threshold; one word returns it. (xxxv) The borderline roster of ten, stepped down, awaiting the maker’s yes or no, item by item or in one breath: 2.1.1.4.5 (sealed by the maker 2026-07-14), 2.1.1.4.8 (sealed by the maker 2026-07-15 — all three roads at once), 2.1.1.4.10 (sealed by the maker 2026-07-15 — the roster’s own guess corrected, not confirmed: material takes by, not e), 2.2.4.4 (sealed by the maker 2026-07-15, out of sequence — seed 3 confirmed, the barren-sink seed refuted; the roster stands at six), 2.1.1.2.12 (sealed by the maker 2026-07-14 — the aoyth-seal; struck late, 2026-07-16), 2.1.4.2 (absolute vs contingent state — the tenure engine gænyin/gilæn one composition away), 3.2.6.4 (vowel harmony — the -as suffix a living witness against the seeds’ ‘none living’), 2.1.7.2.1 (very = the duíra’ya boost?), 2.1.3.1.2.3 (reciprocal intransitive — the labile question is voice design), 3.3.4.6 (intonation × stress — the tone-half moots; the stress-half hangs on 3.3.2). (xxxvi) Aoyth’s seat and the sounding throat (2026-07-14) — aoyth recorded a preposition (the vacancy-blocker; 1.2.2.2.2 unbruised): one word reclasses. aoíth “before” / aoyth “like” — sisters by a letter (í/y), a near-pair for the throat’s day. The lowercase quiz: kin-nouns stand small in the familiar possessive — the keeper’s answer (the everted frame keeps its swallowed lowercase; the toll unrefunded) awaits the maker’s grade. The different-word unminted (the ledger, or iy’s departure). And the throat begins to sound — first keys recorded: Rhié “Hrjaiy” (German j), Férás “Fay-raiss”, ufsae “Oofschye” (ae ≠ æ, deliberate, /aɪ/ as in rye), færs like “fierce”, aoyth “ow-eeɦ”; and, the same day, the agent-seal’s keys: dræao “Dree-ow”, lus “loose”, Ufín “Oofeenn”, Ooraithr “Oo*raiɦ-rr”, fæ “fee”, ghiæanea “sthɦih-ee-ah-neh-eh” — æ “the ee in eel: a lossy ee-eh diphthong”; u/oo “the ool in eel” (the maker’s key, mischief intact :^✓); th ≈ [ɦ] again; gh sounding [sθɦ]-wards — the throat’s deepest surprise yet. (xxxvii) The agent-seal’s riders (2026-07-14) — the farmea-eibh shape’s agent presumed dræao by kinship, unattested; Ooraith “killed” — base class unconfirmed (participle of an unminted kill-verb, or plain adjective); the fronted dræao-phrase’s seat — clause-initial in the attestation, free or canonical, one word. (xxxviii) The topic-absolute’s riders (2026-07-14) — the absolute construction ruled usually a topic clause (O X ∆ / O X V); the familiar possessive reaches epithets (státachaí-færs “His Idiocy”, noun small as ever) with its pragmatics named: the construction presupposes the known bond. Two forks await the maker: F1 — closed (2026-07-14): the order was the maker’s own woops — corrected to sê-fær niïl Pat fæ sulænea “færself a hole fæ dug” (dúe struck): the seat rule holds universally. F2 — closed (2026-07-14): the maker corrects to sê-fær; the 1.5.2.1 paradigm stands (naked sê never 3rd — and bare sê in the infinitive-seal reads “the-self”, the unmarked generic). Fork closed (2026-07-14): the compound is sê-fær — “fær last (it’s an adjective so it takes the in-lieu-of-tmesis position)” — swept record-wide; the family’s turn (sê-miths, sê-cías, sê-í?) forked anew. Also riding: dúe’s two seats (preposed dúe sê; postposed fær-dúe — conditioning unruled); the V/∆ affect-split apparent (V in the unkind saying, ∆ glossed “Amused.”) — one word confirms; -aí the abstract former, 2.2.1.3’s day now one word away. (xxxix) The u-reform and the infinitive-seal’s riders (2026-07-14) — du→u declared, the maker verbatim: “which I will and won’t replace remains to be seen; yes this will cause horrible confusion” — every u-/du- sighting hereafter checked against this watch. eg’s class and independence await. Two typing-readings ratified (2026-07-14, “all else mentioned: count it ratified”): A read as ∆’s typed twin; niil read as niïl. The same sweep ratifies: aoyth’s P-class, the V/∆ affect-split, the everted-frame lowercase account (the quiz graded true), the -aí former, the familiar possessive’s reach and presupposition-pragmatics, the u-reform recording. And one gentle fork: the corrected Eternal coda typed bis-e — ratified as the keyboard’s toll (2026-07-14): þis-e stands. (xl) Circumstance-seal riders (2026-07-14) — thé / ythénÿ division apparent: the no-cleft relative beside the temporary-second-subject relative, the be-choice (bhie / atá) tracking the maker’s semantics — existence earns subjecthood; nonexistence is denied it; one word confirms the division as law. (2026-07-16 — the word came as a law: “the y in yScéan summons the atá family” (the maker) — thé, y-less, takes bhie; ythénÿ, yiosnÿ, yScéan take atá. The subjecthood-semantics stand behind it as the why.) The Adj–N seat fork: reinach Sáinsu (adjective leading) beside “fær last — the in-lieu-of-tmesis position” (sê-fær): pronoun-compounds particular, or one law to reconcile? (2026-07-16: two more Adj-leads witnesses — Iarnach Ixixaí, Chardea Ixixaí — each beside a tmesis twin: the two attributive strategies now stand displayed side by side.) rein the unminted base. And a presumed blood-law: æœá-e leads its NP (determiner-blood); mé-e trails (preposition-blood). (xli) 2.1.1.4.8’s missing noun (2026-07-15) — all three quality-machineries stand ratified (e both ways, -ach derivation, the negative’s three roads) but Humour itself is unminted; the moment it is given, Hín e Humour, lus Humour e lus Hín, Humourach Hín, and æœá-e Humour all close at once — one word. Resolved, same sitting: Gree ‘humour’, Grëach ‘humorous’, Grëachaí ‘humorousness’ — all four templates closed; §2 and §10 updated; the family stands beside Stát/Státach/Státachaí as the -aí abstract-former’s second full run. (xlii) 2.1.1.4.10’s two forks (2026-07-15) — F1: Úrsapê carries the counted-ê with no numeral in sight, against 1.16.6’s ruling that the counted-ê is exclusive to numerals: does a bare plural now share the badge, or is this a different rider on the same letter? F1 — resolved, same sitting: “-ê is simply the pluraliser” (the maker: “brickê”) — not numeral-exclusive at all; 1.16.6 mended (§6). F2: Úrsapfarmaí goes straight from the Úrsap+farm compound to -aí, no visible -ach stage between, unlike Stát→Státach→Státachaí’s three full steps: does -aí now attach straight to noun-verb compounds, or is a stage eliding unwritten? F2 — resolved, same sitting: -ach is skipped when it would be absurd — Úrsapfarmea ‘brick-made’ is sayable, Úrsapfarmach ‘brick-makey’ is not, so the derivation reaches past the impossible stage straight to -aí. Riding gently alongside: Úrsap (sentences 1–2) against Ursap (sentence 3) — resolved: Úrsap throughout, sentence 3 a slip. (xliii) ír vs fær (2026-07-15) — ír ‘its’ appears beside the established fær ‘his/her’ in Yth ír Ralxú… ‘over its government’: an animate/inanimate possessive split, unwitnessed before now — one word confirms or folds it back into fær’s range. Riding alongside, lightly: yth (already ‘past/over/beyond’) fronting a cause-phrase over a plain passive in the same sentence brushes the reserved voice-country (2.1.3.1) — recorded as given, not pressed; whether yth is a genuine passive-agent device or simply an adverbial fronting that reads that way in translation is open.", "table": []}, {"section": "Numerals & dating", "anchor": "num", "title": "The year-name system — base 2+30", "body": "Base 60: a year-name has two places, A-B = A×60 + B, hyphen-joined; the first element capitalises, the second goes bare. Each place (1–60) is one of 30 pair-stems × 2 forms: the ODD value wears the bare stem, the EVEN value its lenited twin — the mutation system doing numerical duty (compare English, were it base 2+30: two = 'onety', four = 'twoty'; 45 = flunp, 46 = flunpty). Attested stems: Slár 9 / Ghslár 10 · Ül 17 / Ghül 18 · Sfeith 21 / Ghsfeith 20 · Îæth 27 / Ghîæth 28 · Ínhe 43 / Ghínhe 44 · Raíwil 49 / Ghraíwil 50 · Heatth 57 / Gheatth 58. Canon checks: 44.27 Ghínhe-îæth = 2667 I.T. (1695 AD, Changing outlawed) · 49.21 Raíwíl-sfeith = 2961 I.T. (the Oath's end) · 49.57 Raíwíl-heatth = 2997 I.T. (the present) · 10.18 Ghslár-ghül = 618 (the Olympiad). Derived: 2983 I.T. (the Bródlainn riots) = 49.43 Raíwíl-ínhe. One Sgiesaetthum = 120 years = 2.0. OPEN WATCH: the Sfeith pair runs {20, 21} against the other pairs' {odd, odd+1} — direction unruled; stems for unseen values await the maker. The notes' analytic counting forms (raí-ghíl-ssaighisseith etc.) were ruled an error by the maker, 2026-07-21 — do not use.", "table": []}, {"section": "Texts", "anchor": "texts", "title": "The Oath of Forswearal (Aufgaolaí, unto 2961 I.T.)", "body": "DANÆAM (session 2026-07-21, working): Air · Sís-thüs o drúræao — ai'en o air'ya · Ł'oob-e'ix Eumruiýa o Laiy'alcuilýa-e'in o yGhiéil e Æœstúpenear ythénunÿ-mé Ornlawy ythé duín Sálthê ten aich ł'oob-e'ix atá o Fær Alcuilaí Sê-dúi'gheo-e'ri —s'exempli-gratia'in -Artea- — o Gheoýa \"s'aige'in\" ten-aoya ythé e lus Oothraíthê ghrœlisea atá s'iyail'in o sin æœá-e Scræsachaí Tïcainê e aufFrœsíýa Gaolaí æœá-mé drusót · O sísiyao e Thaln'ghrœliseæ-cías'afrê · O aich sísiyao e cías Tïaolc y'wil'th. Air · Ten \"s'aige'in\" -aoa o thas't'ya- Fís e Emma æxó Thiutel æxó Eigain tes Wighæln o Gaolê yiosnÿ Sí-dræao sór atá — sin lus yGhainn-e sê-færs æxó sê-cíaos æxó duý-e o sy sê-ír Ao'efui'a gæn — æœá-mé drusót · O mis Wightil dué sárghu æxó sclaí æxó dræao lus Sclúneäi sís-thurn-e sainfasæn duéo mith ïegæn't. — ENGLISH (canon, from the draft): Hereby, before the Darkness and the Watching Light, before the Un-Raped Mother and Faer Avatar in the Wealds, Faer Imperial Radiance [Artea e.g.], and before God, do I, [Legal Name], Grand-descendent of the Changed, singly and without trickery, forswear kinship with the changelings' hosts; their descendants in the Uplands; their families entire. I forswear what-and-ever debt of blood, title, and property is owed my clan and kin by Sí-e, no matter sê-faer clade, and all right to either seek, to either ask after, to nor either benefit by the closure thereof. NOTE: the date-clause's numeral rendering is under revision (maker, 2026-07-21).", "table": []}, {"section": "Derivation", "anchor": "deriv", "title": "Reduplication: the verbal noun (X-X = “the X-ing”)", "body": "Attested across stack-2: Othœsræ-othœsræ 'outlawing' · Insaig-insaig 'voting' · Sinótæn-sinótæn 'the following' · Farm-farm 'the building' · Brís-brís(ýa) 'the breaking' · Fœdh-fœdhýa 'the stealing-of'. The doubled stem names the act itself; the article and genitives wrap it as any noun ('lus Sinótæn-sinótæn eibh' — the following was). Red's article leans on it hardest: Farm-farm, Brís-brís — the doing as the thing done to you.", "table": []}, {"section": "Derivation", "anchor": "deriv", "title": "-ea: the done participle", "body": "Brísea 'broken' · scéalerea 'written' · pliguea 'folded' · cuirsea 'arched' · baouea 'bowed' · Sclúnea 'closed' · Oobsígænea 'imprisoned' · gænea 'given' · Ghrœlisea 'descended' · Oothraíthê 'the Changed (people)'. Stacks with stíl- for the continuing state: stílbrís 'still-breaking' (cf. stílgænea 'had-given').", "table": []}, {"section": "Numerals & dating", "anchor": "num", "title": "Ordinals, possessive years, and the AD digit-mode", "body": "ORDINAL: -eith — 'ghslár-ghüleith Œlimpiad-e' = the 10.18th Olympiad (618th). POSSESSIVE YEAR: the Or'…'ai tmesis frame wraps a year-name — 'Mis Or'ghínhe-îæth'ai yDuý.r.r' = our 2667th-year per-i.t. AD READING: Anno Domini years are read as digit-pairs, not base-60 places — 'Uain-éx o slár-cliffýa -anno Domini-' = 1695 AD (one-six and nine-five). Stems attested in digit-mode: Uain 1, Cliff 5, Éx 6, Slár 9; their year-series pairs remain unruled. DATES EXIST BY DONATION: 'Raíwíl-heatth mith gæn' — it is 2997, lit. we give 49.57; and the present marks: 'lus Sgiesaetthum-e … dræœa Raíwíl-ínhe duálthë marcæn' — the Sgiesaetthum from 2983 to today marks (Raíwíl-ínhe = 2983, the Bródlainn riots: sealed).", "table": []}, {"section": "The tmesis engine", "anchor": "s8", "title": "Tmesis in derivation and names", "body": "Stack-2 hosts of note: Ffemá'bissal-iy'dheach 'Appellate court' · Ó'rrync'ghs 'spine' · felCne'téxt'ilea 'ground-down tissue' · afStrœ'charmænsy'œch 'dried-up skin' · Próitínä'raxis-e'íach 'proteinaceous-praxis' — derivation ingesting its own twin, the prionic motto made morphology · Oob'aufGaolaí'sígænea 'incar'aufGaolaí'cerated' — the prison-host ingests the whole clade-name · Or'ghínhe-îæth'ai — the our-frame ingests a year-name. Guests may be pure cry: Ai'æ'titlop -luai- — 'note-you-topple, aiee!'", "table": []}, {"section": "The imperative", "anchor": "s7", "title": "Trill-marks as spatial direction", "body": "In running text ∆ and V do spatial duty, not only vocative: 'felCne'téxt'ilea ∆ afStrœ'charmænsy'œch V' — the dust of ground-down tissue, ↑ dried-up skin ↓. The build-passage closes '• ∆ •' — the command lifts. (Vocative force elsewhere intact: ∆barc — the scream goes up.)", "table": []}, {"section": "Texts", "anchor": "texts", "title": "Stack-2: the Faerieland opening, in Danæam (2026-07-22)", "body": "The full opening rendered: the 2667 frame ('Mis Or'ghínhe-îæth'ai yDuý.r.r ythés tack duilín yMedhamýa ghslár-ghüleith Œlimpiad-e atá mith gæn') · the Oath · the 2997 Sgiesaetthum line · Night's stage-passage with Red's article spidering her back ('Dús Orscænyæn-orscænyæn yduý sírffrach niheag Erlyê … lus Sinótæn-sinótæn eibh') · and the article itself, the build-liturgy, closing 'Smiotherách Praxis o Próitínä'raxis-e'íach—'ya'. Names sealed: Ruth 'red (noun)' = Red; Yon 'of the night' = Night; Síonæiya = Faerieland — the realm's endonym, cf. the Síonæyais. Three layers attested: Danæam · literal gloss · naturalistic English.", "table": []}, {"section": "The tmesis engine", "anchor": "s8", "title": "Monster tmeses in the wild (stack-r2)", "body": "The revised stack hosts the largest tmeses yet: ro'gænstílgæn'il 'not-insufficiently-had-and-still-gives' (ro'…'il around gæn-stíl-gæn — gives, and has had, and still gives, sufficiently) · Dé'ahor'cruí'sáillaí'ch'ía'er 'toward-facing-audience-speaking-being' (Dé'…'er around ahoría-cruích-sáillaí-ch-ía) · aufGao'samsca'laíê 'aufGaolaí communities' (aufGao'…'laíê around samsca) · Gi'regéar'gýa 'the jaw-region' (Gig + regéar) · Dú'greibach-greibach-e's 'toward-the-believing-of' (Dú'…-'s around a reduplicated verbal noun) · and the contraction stil'ten'át 'sti'I'll-do'. Rule of thumb confirmed: the wrapper carries the grammar, the core carries the meaning, and a core may itself be reduplicated.", "table": []}, {"section": "Negation & polarity", "anchor": "s5", "title": "Negation fusion extends: past, perpetual, future (stack-r2)", "body": "-'thte/-n't fusion now attested across the tense system: atáea'thte 'wasn't' (past of be) · gilæn't 'never-gave / not-eternally-regives' (negative of gilæn; doubled 'gilæn't gilæn't' for emphasis — 'never, never') · ïegæn't 'will-not-give' (future). The fusion is not a present-tense quirk; it is the general negative strategy.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Quotation punctuation: *>- … -<* and »- … -«", "body": "Direct speech is delimited by *>- … -<* (outer quote) and »- … -« (nested quote inside it): *>-»-Air · \"S'aige'in\" mis Dú'greibach-greibach-e's Uoinainê mith gæn-« niïl sain Prïxreg bhie.-<* — \"'As-said' our toward-the-believing-of women we give\" a great principle is. faer may tag the close of a quote: '*>-Łix-<* fær Sclíeclu-Sclíeclu sœinea' — \"Exact,\" faer conclusion sounded.", "table": []}, {"section": "Still emerging", "anchor": "s12", "title": "Trill marks as typographic emphasis (stack-r2)", "body": "The ∆ / V system of stack-2 (scream ↑ / whisper ↓) now does prose emphasis: 'lus V lheif ∆ guiáł V lheif ∆ Yac' — the …grey… !gold! …grey… strobe. V wraps a hushed/flattened beat, ∆ marks a struck/sharp beat. Ceiling-factory strobe: our new and worse but necessary sun.", "table": []}, {"section": "The interrogative system", "anchor": "s6", "title": "Scér / Scén in the wild (stack-r2)", "body": "The closing passage runs both Q: markers back to back: 'Scér Ruth — syá — Yon Stár gilæn't gilæn't?' (PAST — over fused-negative gilæn't) and 'Scén stil'ten'át stílát?' (NON-PAST — 'Q: sti'I'll-do still-do?'). ythemnÿ 'how' also appears inside reported speech: 'Dúordhách ythemnÿ … atá í bhie' — tidy how … it is.", "table": []}, {"section": "Derivation", "anchor": "deriv", "title": "-iya: one-who / that-which (agentive-relativising)", "body": "Her own note, kept verbatim: '-iya: (per the nearest sísiya and nearest íosiya)'. Attested: Thérafthyiya 'therapist' (Theráfthyê-e + -iya) · Líciya 'body-one/-of' · Sísiyaoýa 'one who/that the same one was' (Oath). Reduplication keeps producing verbal nouns beside it: greibach-greibach 'the believing', Útcár-Útcár 'the accusing', Crith-crith 'the jittering', Sclíeclu-Sclíeclu 'the conclusion', Drúnhœme-Drúnhœme 'the Coming-Forward'.", "table": []}, {"section": "Numerals & dating", "anchor": "num", "title": "SEALED: the small cardinals — aint · ghaint · raí · ghraí", "body": "Ruled 2026-07-23: 1 Aint · 2 Ghaint · 3 Raí · 4 Ghraí; ordinal ainteith 'first'. The pairing principle is the year stems' own: unmarked odd, gh- even (Slár 9/Ghslár 10 · Ül 17/Ghül 18 · Sfeith 21/Ghsfeith 20 · Îæth 27/Ghîæth 28 · Ínhe 43/Ghínhe 44 · Raíwil 49/Ghraíwil 50 · Heatth 57/Gheatth 58 — now Aint 1/Ghaint 2 · Raí 3/Ghraí 4). Consequences: the Final-Boss Haul record 'ghraí = 3' is corrected to ghraí = 4; the Oath's analytic date clause raí-ghíl-ssaighisseith ([4.9.21]) retires with the ruled-error system — its replacement remains under revision (likely Raíwíl-sfeith = 49.21 = 2961); 5 and 6 are still unmade. These are counting cardinals, not year-stems: the converter's stem table is unchanged. Ghraíïe 'fourily' stands confirmed with its root sealed.", "table": []}, {"section": "Texts", "anchor": "texts", "title": "Stack-2 revised & extended: therapy passage + closing (2026-07-23)", "body": "The revised stack doubles the text. Revisions: Oath preamble now in Danæam ('Efui dué Thaln sëain æxó duínsaig' — of-to land own NAND to-vote) · thaioss't'ya variant · spidering line reordered 'lus Aoiyid e Útcáry'ya Ruth-e' · tense fix 'dræao atáea pliguea' · build-liturgy gains 'Efui niïl drúach thas — ios 'æ -'farm', 'Thas yŁærmuê mæ ios mæ ygyg', 'Aoa-thiosas't Uœrd', '— Sin saige. — Brís.', 'Ai'farm. Mæ farm.' New: the therapy passage ('Łyüsnÿ ghraíïe Theráfthyê-e dúao atáea…' — four therapists ago; the assault disclosure; 'mis Dú'greibach-greibach-e's Uoinainê mith gæn' — we believe women; 'Lus Útcáry Ruth-e Yon eibh' — Red's accuser was Night; the solar-bridge sun; closing 'Dús Trawidía o dús Crith-crith o dúrrync dús Sclostaíría') and the closing ('Byræao Stár dúe Ruth ten Stúpen-wínr mis ainteith Arbhenu ïegæn't. Scér Ruth — syá — Yon Stár gilæn't gilæn't?…'). Ends with the Síonæiya reprise of the Oath ('Sísthurn' variant opening), signed Edith M Lyre, Writer.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "About the ledger pass", "body": "Patterns that emerged or were confirmed while coining the 837 — each stated from the coinages themselves, not imposed on them. Source: the Comprehensive Lexicon's structure notes, ledger pass completed 2026-07-27. The ledger rows themselves (twelve comparative languages: ME · IS · GA · EU · DE · LA · CY · DZ · GRC · SA · Q · ON) ride on each coined entry in the lexicon lookup.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "Numerals — the gh- pair rule", "body": "The lexicon's ruling of 2026-07-23 (aint 1 · ghaint 2 · raí 3 · ghraí 4, with gh- marking the even member and matching the year-stem pairs Slár 9/Ghslár 10, Îæth 27/Ghîæth 28, Ínhe 43/Ghínhe 44, Raíwil 49/Ghraíwil 50) is confirmed by this pass: îfy 11 / ghîfy 12 were coined as a pair under the stated rule that every number 1–60 pairs with its prior odd or subsequent even number — as were Yfu 15 / Ghyfu 16. Also from this pass: thrhaithíl 216,000 and thíghráied 12,960,000, alongside miłió.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "Reduplication", "body": "Exact doubling, for actions that consist in their own repetition: Blaotzúl-blaotzúl applause (cf. Blaotzúlæn, to applaud) · Scratean-scratean record · Senthith-senthith sense (variant beside Senthithaí) · Chuffchœm-chuffchœm shortcoming · Mëtmët amount · sumsumæn sweep · Tintin rumble · mÿmomÿ several · lósëlós obvious.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "The indefinite paradigm — yel- / uao- / æœ-", "body": "A three-way any / some / no series, with -łíc for persons and the ios frame for things. Adverbial extensions: yelthurn anywhere · yelmá anyway · yelëg any direction · uaothüsýa sometime. þiníya stands outside the paradigm — the predicted form would be built on æœ- and the ios frame. Left as coined; flagged as the one irregular member.", "table": [["", "any-", "some-", "no-"], ["body", "yełíc", "uaołíc", "æœłíc"], ["thing", "ios yelthas", "ios uaothas", "þiníya"], ["one", "nÿel", "—", "—"]]}, {"section": "The ledger pass", "anchor": "ledger", "title": "The ios frame", "body": "ios thas (that + what) = thing · ios thüs (that + when) = then. These make ios yelthas and ios uaothas regular derivations rather than one-offs.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "The ley frame — Lén, Glaosc-", "body": "Lén is the ley. Glaosc- is the automaton (Glaoscá). The compounds are not about air or ground but about iron running on a line that was already there — the dark rails in the starblack sky are the primary sense, the terrestrial ones the borrowing: Glaoscêlintilény aircraft (automatic-ley-liner) · Glaoscêlintiługy airliner · glaosclíntách railside · Łége route · Glaoscléÿ phone.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "The sei- / sein- cluster", "body": "Six coinages for re-/back- verbs share an onset: seinutscu recall · seïldhu recollect · seifandræ respond · Seinhœmaí result · seïnaigg retract · seiffrathí withdraw. Outside it: erinæn remember · sininithíáchæ repeat · Faníucæí reply · Lebatscúne respect. Undecided whether this is a morpheme or a coincidence of ear.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "Deliberate homonyms", "body": "Four pairs share one form by decision, not accident: góïyth — akin / similar · yiusétæn — put / set (put was recoined from údúsétæn to merge them) · Laíaí — sight / vision · sy — such / thus.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "The -e postposition", "body": "Hyphen-hung, placed after its topic: Saíny Wil-e (Waker All-of) · scónách waíl-e (always already) · Thexa Ür-e (urtext) · Steam niyail-e (unison) · Scale truck-e (truck) · sógjæn uÿth-e (surpass) · uain Beyrceg nibísïl-e a'ithæ'nn (another beerkeg, please).", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "Directional pairs", "body": "Afyáëg sunrise / Felyáëg sunset — a shared -yáëg with af- and fel- as the directional elements, now productive.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "Kinship", "body": "Sídia — sibling, ungendered; entered at sister, with the explicit ruling that there are no gendered sibling titles. It is the only kin term on the 837-word sheet, so nothing else needs to agree with it.", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "Loanwords accepted", "body": "Strauss ostrich · Saffîr sapphire · Fótca vodka · Stigma tattoo · Thelefigjíon television · üranyum uranium · uloominíäm aluminium · Scale truck-e truck · óc∆éy • okay (with the ∆ up-trill).", "table": []}, {"section": "The ledger pass", "anchor": "ledger", "title": "Gaps left open", "body": "shall — entered n/a; no lexeme, future handled morphologically. þiníya — outside the indefinite paradigm, as above. Angúl ring — built on angulus rather than the row's anulus; angulus is the Chœin (angle) row. Kept as coined. Beyr, Ceg, Beyrceg — attested inside the níbísy row's commentary (uain Beyrceg nibísïl-e a'ithæ'nn) but not coined as headwords; awaiting the maker's word.", "table": []}];

 was the following:", "type": "reduplication · names"}, {"dan": "Sin Craghê fœrmæn sy farm • Sin Ffeë fiulæn •", "literal": "As cracks form so build: as teeth chip:", "english": "Build like cracks form. Like teeth chip.", "type": "imperative · simile"}, {"dan": "Mis Bocraíp mith Fœrm gæn. Brísea mæ bhie • Brísea • Brísea o stílbrís.", "literal": "Our lips we shape give. Broken we break. Broken. Broken and still-breaking.", "english": "Lips take shape. You are broken. Broken. Broken and still breaking.", "type": "existential · stíl-"}, {"dan": "Ai'æ'titlop -luai- o aich -'uazilæn o aich— • ∆ • O aich sin niïl Felcadhá e Príónê sy ai'farm.", "literal": "Note-you-topple —aiee!— and also -totter and also— ↑ — and also as a cascade of prions so note[all-listening]-build.", "english": "Topple and totter and, like a cascade of prions, build.", "type": "imperative · trill-marks"}, {"dan": "Smiotherách Praxis o Próitínä'raxis-e'íach—'ya.", "literal": "Infectious praxis and proteinaceous-praxis—'ya.", "english": "Proteinaceous infectious praxis.", "type": "tmesis · the motto"}, {"dan": "Duínráshië afArch úsét Gradhamýa duilín niïl Cruaff e Garrohyê leagístach o guiïn Yon cuirsea o baouea.", "literal": "Reversely way-up on Stage within a clutch of tentacles elastic and yellow Night arched and bowed.", "english": "In a clutch of yellow elastic tentacles, way up on stage, Night arched and bowed in reverse.", "type": "stage picture"}, {"dan": "mis Dú'greibach-greibach-e's Uoinainê mith gæn.", "literal": "our toward-the-believing-of women we give.", "english": "We believe women.", "type": "therapy passage — existential engine"}, {"dan": "Lus Útcáry Ruth-e Yon eibh.", "literal": "The accuser Red-of Night was.", "english": "Red's accuser was Night.", "type": "therapy passage"}, {"dan": "Łyüsnÿ ghraíïe Theráfthyê-e dúao atáea.", "literal": "the-then-when fourily therapists-of ago was.", "english": "It was four therapists ago.", "type": "therapy passage — time expression"}, {"dan": "Sísthurn Fælaê dús Útcár-Útcár Fælaê-e í gæn.", "literal": "Here fey toward-the accusing fey-of it gives.", "english": "Here, fey accuse fey.", "type": "therapy passage — existential engine"}, {"dan": "Uoinainê dús Útcár-Útcár Uoinainê-e í ro'gænstílgæn'il.", "literal": "women toward-the accusing women-of it not-insufficiently-had-and-still-gives.", "english": "Women do sufficiently accuse women.", "type": "therapy passage — monster tmesis"}, {"dan": "Lus yThérafthyiya nugænea.", "literal": "The therapist nodded.", "english": "The therapist nodded.", "type": "therapy passage"}, {"dan": "Úsét bilach Charmænsy Yon-e lus Œurdê e Fenthœs Ruth-e o Útcár'ma-útcár'ma scéalerea eibh.", "literal": "On bare skin Night-of the words of defence Red-of and counter-accusation written were.", "english": "On Night's bare skin were written the words of Red's defence, and the counter-accusation.", "type": "therapy passage"}, {"dan": "O Sísiya sin nïil yálénëách Brëch sy dúéalaf Gnasthýa sê-ír-e lus V lheif ∆ guiáł V lheif ∆ Yac e lus Scëel-scëel Wilfarmái-e sin mis neria o múlchtma ax niecscách Yáe dúe saílturn.", "literal": "And this as a solar bridge so up-inside-of the nest itself-of, the …grey… !gold! …grey… strobe of the ceiling factory-of, so our new and worse but necessary sun to welcome.", "english": "And this — like a solar bridge up into the nest itself — to welcome the …grey… !gold! …grey… strobe of the ceiling factory as our new and worse but necessary sun.", "type": "therapy passage — trill marks"}, {"dan": "Dús Trawidía o dús Crith-crith o dúrrync dús Sclostaíría.", "literal": "toward-the seizure and toward-the jittering and backward toward-the wrenching.", "english": "Into seizure, into jittering, and back into wrenching.", "type": "therapy passage — closing cadence"}, {"dan": "Byræao Stár dúe Ruth ten Stúpen-wínr mis ainteith Arbhenu ïegæn't.", "literal": "Through-from love for Red I rape-name-being our first event will-not-give.", "english": "Out of love for Red, I will not make rape-naming our first event.", "type": "closing passage"}, {"dan": "Scér Ruth — syá — Yon Stár gilæn't gilæn't?", "literal": "Q:PAST Red — perhaps — Night love never-gave never-gave?", "english": "Did Red — perhaps — never, never love Night?", "type": "closing passage — Q: marker"}, {"dan": "Scén stil'ten'át stílát?", "literal": "Q:NON-PAST sti'I'll-do still-do?", "english": "Will I still do it?", "type": "closing passage — Q: marker"}, {"dan": "Yios mith þis mís Dé'ahor'cruí'sáillaí'ch'ía'er scaírea gilæn't lus Fainía yios duý þis Frÿn atáea ghydæa.", "literal": "That we her our toward-facing-audience-speaking-being could never-give — the catch that in her throat was meant.", "english": "We could never give her our facing-the-audience speech — the catch that was meant for her throat.", "type": "closing passage — monster tmesis"}, {"dan": "Efui niïl drúach thas — ios 'æ -'farm.", "literal": "Topic: a next what — that-you -build.", "english": "Whatever comes next — you build it.", "type": "build-liturgy addition"}, {"dan": "Thas yŁærmuê mæ ios mæ ygyg.", "literal": "What noises you that you eke.", "english": "Whatever noises you can eke out.", "type": "build-liturgy addition"}, {"dan": "— Sin saige. — Brís.", "literal": "— As said. — Break.", "english": "— As said. — Break.", "type": "build-liturgy addition"}];
for(const e of RULES){
  e._t = new Set(stoks(e.title));
  e._b = new Set(stoks(e.body));
  e._s = fold(e.section);
}
const q = document.getElementById('q');
const out = document.getElementById('results');
const count = document.getElementById('count');
const filtRow = document.getElementById('secfilt');
let activeSec = null, tab = 'rules';
const SECTIONS = [...new Set(RULES.map(e=>e.section))];
filtRow.innerHTML = SECTIONS.map(s=>`<button class="chip sec" data-s="${esc(s)}">${esc(s)}</button>`).join('');
q.focus();
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); q.select(); }
  if(e.key==='Escape' && document.activeElement===q){ q.value=''; run(); q.blur(); }
});
q.addEventListener('input', run);
document.getElementById('tabRules').onclick = ()=>{ tab='rules'; activeSec=null; syncTabs(); run(); };
document.getElementById('tabEx').onclick = ()=>{ tab='ex'; syncTabs(); run(); };
function syncTabs(){
  document.getElementById('tabRules').setAttribute('aria-selected', tab==='rules');
  document.getElementById('tabEx').setAttribute('aria-selected', tab==='ex');
  document.getElementById('convwrap').style.display = tab==='rules' ? '' : 'none';
  filtRow.style.display = tab==='rules' ? '' : 'none';
}
document.addEventListener('click', e=>{
  const s = e.target.closest('.sec');
  if(s){ activeSec = activeSec===s.dataset.s ? null : s.dataset.s;
    document.querySelectorAll('.sec').forEach(b=>b.style.borderColor = b.dataset.s===activeSec ? 'var(--accent)' : '');
    run(); }
});
function miniTable(rows){
  if(!rows || !rows.length) return '';
  const head = rows[0].map(c=>`<th>${esc(c)}</th>`).join('');
  const body = rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<table class="mini"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
// long record-prose breathes: paragraph at (i)(ii)(iii) seams — display only
function paraHTML(body){
  const parts = body.split(/\s(?=\((?:i|ii|iii|iv|v|vi|vii|viii|ix|x|xi|xii)\)\s)/);
  if(parts.length < 2) return esc(body);
  return parts.map(p=>`<p>${esc(p)}</p>`).join('');
}
function ruleCard(e){
  const seal = e.anchor==='s9' ? '<span class="badge sealed">sealed room</span>'
             : e.anchor==='s12' ? '<span class="badge working">emerging</span>'
             : e.anchor==='ledger' ? '<span class="badge coined">ledger pass</span>' : '';
  const body = e.body ? `<div class="notes ${e.body.length>260?'clamp':''}">${paraHTML(e.body)}</div>${e.body.length>260?'<button class="more">more…</button>':''}` : '';
  return `<div class="card">
    <div class="src" style="margin:0 0 .2rem">${esc(e.section)}</div>
    <div class="form" style="cursor:default;font-size:1.12rem">${esc(e.title)}</div>
    <div class="meta">${seal}</div>
    ${body}${miniTable(e.table)}
  </div>`;
}
function exCard(e){
  return `<div class="card">
    <div class="form" style="cursor:default;font-size:1.05rem">${esc(e.dan)}</div>
    <div class="notes" style="font-style:italic">${esc(e.literal)}</div>
    <div class="gloss" style="font-size:.95rem">${esc(e.english)}</div>
    <div class="meta"><span class="badge">${esc(e.type)}</span></div>
  </div>`;
}
function run(){
  const qWords = qWordsOf(q.value);
  if(tab==='ex'){
    const v = fold(q.value);
    const hits = !v ? EXAMPLES : EXAMPLES.filter(e=>
      fold(e.dan).includes(v) || fold(e.literal).includes(v) || fold(e.english).includes(v));
    count.textContent = hits.length + ' examples';
    out.innerHTML = hits.length ? `<div class="grid">${hits.map(exCard).join('')}</div>`
      : '<div class="empty">no example answers to that</div>';
    return;
  }
  let pool = RULES;
  if(activeSec) pool = pool.filter(e=>e.section===activeSec);
  if(!qWords.length){
    count.textContent = pool.length + ' rules';
    const groups = new Map();
    for(const e of pool){ if(!groups.has(e.section)) groups.set(e.section,[]); groups.get(e.section).push(e); }
    let h='';
    for(const [sec, list] of groups)
      h += `<div class="tier"><h2>${esc(sec)}</h2><span class="n">${list.length}</span><span class="rule"></span></div><div class="grid">${list.map(ruleCard).join('')}</div>`;
    out.innerHTML = h; return;
  }
  const t1=[], t2=[];
  for(const e of pool){
    const titleHit = qWords.every(vs => vs.some(x => e._t.has(x)));
    const bodyHit = qWords.every(vs => vs.some(x => e._b.has(x)));
    if(titleHit) t1.push(e); else if(bodyHit) t2.push(e);
  }
  count.textContent = (t1.length+t2.length)+' rules';
  out.innerHTML =
    (t1.length?`<div class="tier"><h2>by name</h2><span class="n">${t1.length}</span><span class="rule"></span></div><div class="grid">${t1.map(ruleCard).join('')}</div>`:'') +
    (t2.length?`<div class="tier"><h2>in the text</h2><span class="n">${t2.length}</span><span class="rule"></span></div><div class="grid">${t2.map(ruleCard).join('')}</div>`:'');
  if(!t1.length && !t2.length) out.innerHTML = '<div class="empty">no rule answers to that — perhaps a sealed room</div>';
}
// ---- year-name converter (base 2+30) ----
const STEMS = {9:'Slár',10:'Ghslár',17:'Ül',18:'Ghül',20:'Ghsfeith',21:'Sfeith',27:'Îæth',28:'Ghîæth',43:'Ínhe',44:'Ghínhe',49:'Raíwil',50:'Ghraíwil',57:'Heatth',58:'Gheatth'};
const REV = {}; for(const [v,f] of Object.entries(STEMS)) REV[fold(f)] = +v;
function convYear(){
  const y = parseInt(document.getElementById('yin').value, 10);
  const o = document.getElementById('yout');
  if(isNaN(y) || y<0){ o.textContent='—'; return; }
  const a = Math.floor(y/60), b = y%60;
  const miss = [];
  if(!(a in STEMS)) miss.push(a); if(!(b in STEMS)) miss.push(b);
  if(miss.length){ o.innerHTML = `<span style="color:var(--rust)">stem${miss.length>1?'s':''} Mehilýa nhœme: ${miss.join(', ')}</span>`;
    document.getElementById('ycalc').textContent = `${y} = ${a}×60 + ${b}`; return; }
  const A = STEMS[a], B = STEMS[b];
  const Bbare = B.charAt(0).toLowerCase()+B.slice(1);
  o.innerHTML = `<b>${A}-${Bbare}</b>`;
  document.getElementById('ycalc').textContent = `${y} = ${a}.${b} = ${a}×60 + ${b}`;
}
function convName(){
  const v = document.getElementById('nin').value;
  const o = document.getElementById('nout');
  const parts = v.split(/[-–—\s]+/).filter(Boolean);
  if(parts.length!==2){ o.textContent = 'two places, hyphen-joined: e.g. Ghínhe-îæth'; return; }
  const a = REV[fold(parts[0])], b = REV[fold(parts[1])];
  if(a==null || b==null){ o.innerHTML = '<span style="color:var(--rust)">aoa ooghea</span>'; return; }
  o.innerHTML = `<b>${a*60+b}</b>`;
  document.getElementById('ncalc').textContent = `${a}.${b} → ${a}×60 + ${b} = ${a*60+b}`;
}
document.getElementById('yin').addEventListener('input', convYear);
document.getElementById('nin').addEventListener('input', convName);
document.addEventListener('click', e=>{
  const qk = e.target.closest('.qk');
  if(qk){ document.getElementById('yin').value = qk.dataset.y; convYear(); }
});
syncTabs(); run();
</script>
