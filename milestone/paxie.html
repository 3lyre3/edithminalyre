  :root {
    --line:       #FFFFFF;
    --sand:       #EAD9AE;         /* golden bone: the lit colour */
    --sand-glow:  238, 210, 150;   /* parchment light, close in */
    --sand-deep:  214, 178, 98;    /* old gold, further out */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000;
    display: grid;
    place-items: safe center;   /* "safe": a map wider than a phone scrolls from its left edge instead of hanging off it */
    overflow-x: auto;
  }

  /* keeps the map legible: it may scroll sideways on a phone rather than shrink to a thumbnail */
  .map {
    display: block;
    width: min(100vw - 3vmin, 1800px);
    min-width: 960px;
    height: auto;
    padding: 1.5vmin;
  }

  .map path {
    fill: none;
    stroke: var(--line);
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 420ms ease-out;
  }
  .map path.hit { stroke: transparent; stroke-width: 34; pointer-events: stroke; transition: none; }
  .map path.blob { fill: var(--line); transition: fill 420ms ease-out, stroke 420ms ease-out; }
  .map text {
    font-family: "Map Mincho", "Noto Serif JP", serif;
    fill: var(--line);
    paint-order: stroke fill;        /* a black halo so a label stays legible where a line runs under it */
    stroke: #000;
    stroke-width: 10;
    stroke-linejoin: round;
    transition: fill 420ms ease-out;
  }
  .map text.n { font-weight: 700; }
  .map text.c { font-weight: 400; }

  a.pt {
    cursor: pointer;
    outline: none;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 480ms cubic-bezier(.22, .68, .2, 1), filter 480ms ease-out;
  }
  a.pt:hover, a.pt:focus-visible {
    transform: scale(1.045);
    filter:
      drop-shadow(0 0  1.5px rgba(var(--sand-glow), .95))
      drop-shadow(0 0  5px   rgba(var(--sand-glow), .70))
      drop-shadow(0 0 14px   rgba(var(--sand-deep), .55))
      drop-shadow(0 0 32px   rgba(var(--sand-deep), .30));
  }
  a.pt:hover path:not(.hit), a.pt:focus-visible path:not(.hit) { stroke: var(--sand); }
  a.pt:hover path.blob,      a.pt:focus-visible path.blob      { fill: var(--sand); }
  a.pt:hover text,           a.pt:focus-visible text           { fill: var(--sand); }

  /* ── back, top right: white at rest, sand when touched ── */
  .back {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 10;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    line-height: 1;
    padding: 10px 12px;
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    outline: none;
    transition: color 420ms ease-out, text-shadow 420ms ease-out;
  }
  .back:hover, .back:focus-visible {
    color: var(--sand);
    text-shadow: 0 0 5px rgba(var(--sand-glow), .7), 0 0 16px rgba(var(--sand-deep), .45);
  }

  @media (prefers-reduced-motion: reduce) {
    a.pt, .map path, .map text, .back { transition: none; }
    a.pt:hover, a.pt:focus-visible { transform: none; }
  }

  /* the shared site chrome (mounted by ../site.js) has no place on the plates */
  .theme-toggle, .cursor-glow, .wisp, .grain { display: none !important; }
</style>
