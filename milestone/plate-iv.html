<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate IV – This is not the world</title>
<style>
  :root { --plate-w:1388; --plate-h:2048; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 2.4vmin;
    display: grid; place-items: center;
    background: #161D1E;
    background-image: radial-gradient(ellipse 78% 68% at 50% 44%,
                       #27312F 0%, #1B2324 52%, #101516 100%);
  }
  .plate {
    position: relative;
    width: min(100%, calc((100dvh - 4.8vmin) * var(--plate-w) / var(--plate-h)));
    box-shadow: 0 2.2vmin 5.5vmin rgba(0,0,0,.55), 0 .3vmin 1.2vmin rgba(0,0,0,.40);
  }
  svg { display: block; width: 100%; height: auto; }

  .zone {
    --near: 0;
    transform-box: view-box;
    transform-origin: 50% 50%;
    transition: transform 420ms cubic-bezier(.2,.7,.2,1);
    outline: none;
  }
  .zone > use { transition: filter 480ms ease-out; }
  .zone { transition: transform 520ms cubic-bezier(.2,.7,.2,1); }
  .hint, .gleam { pointer-events: none; }

  /* proximity: the shine begins as the cursor comes within reach, and grows */
  .hint { opacity: calc(var(--near) * .30); transition: opacity 220ms linear; }
  .hint rect { transform: translateX(calc(-1 * var(--sw))); }
  .zone.near .hint rect { animation: drift 4.2s linear infinite; }

  /* hover: the piece lifts, and a brighter band sweeps through once */
  .gleam { opacity: 0; transition: opacity 260ms ease-out; }
  .gleam rect { transform: translateX(calc(-1 * var(--sw))); }

  .zone:hover, .zone:focus-visible { transform: scale(var(--pop)); }
  .zone:hover > use, .zone:focus-visible > use {
    filter: drop-shadow(0 14px 26px rgba(0,0,0,.34)) drop-shadow(0 3px 6px rgba(0,0,0,.18)) brightness(1.02) saturate(1.03);
  }
  .zone:hover > .gleam, .zone:focus-visible > .gleam { opacity: .24; }
  .zone:hover > .gleam rect, .zone:focus-visible > .gleam rect {
    animation: sweep 1100ms cubic-bezier(.3,.5,.3,1) both;
  }
  .zone:hover > .hint, .zone:focus-visible > .hint { opacity: 0; }

  @keyframes sweep {
    from { transform: translateX(calc(-1 * var(--sw))); }
    to   { transform: translateX(var(--sw)); }
  }
  @keyframes drift {
    from { transform: translateX(calc(-1 * var(--sw))); }
    to   { transform: translateX(var(--sw)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .zone, .zone > use, .hint, .gleam { transition: none; }
    .gleam rect, .hint rect { animation: none !important; }
  }

  /* the lattice of walkways: it darkens and throws a shadow onto the cells instead of gleaming */
  .zone.maze:hover > use, .zone.maze:focus-visible > use {
    filter: brightness(.66) contrast(1.14) drop-shadow(0 12px 16px rgba(0,0,0,.6)) drop-shadow(0 3px 5px rgba(0,0,0,.4));
  }
  .zone.maze:hover > .gleam, .zone.maze:focus-visible > .gleam { opacity: 0; }
  .zone.maze > .hit { pointer-events: fill; }
  /* while a zone is being raised to the top of the stack, hold it still for a frame so its lift can still animate */
  .zone.linked { cursor: pointer; }
  .zone.hold, .zone.hold:hover { transform: none; }
  .zone.hold > use { filter: none; }
  .zone.hold > .gleam { opacity: 0; }
  .zone.hold > .gleam rect { animation: none; }

  #labels { pointer-events: none; }
  .label {
    opacity: 0; transform: translateY(10px);
    transition: opacity 300ms ease-out 90ms, transform 420ms cubic-bezier(.2,.7,.2,1) 90ms;
    transform-box: view-box;
  }
  .label text {
    font-family: 'Libre Caslon Display', 'Big Caslon', 'Adobe Caslon Pro', 'Libre Caslon Text', Caslon, Georgia, serif;
    font-weight: 400; letter-spacing: .035em;
    fill: #EFE7D4;
    paint-order: stroke fill;
    stroke: rgba(28,24,18,.42); stroke-width: .16em; stroke-linejoin: round;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.45));
  }
  .label .plaque { fill: rgba(22,20,16,.46); filter: url(#soft); }
  @media (prefers-reduced-motion: reduce) { .label { transition: none; transform: none; } }

    let t = L ? ((px-ax)*dx + (py-ay)*dy) / L : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cx = ax + t*dx, cy = ay + t*dy;
    return Math.hypot(px-cx, py-cy);
  }
  function inside(px, py, pts) {
    let hit = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > py) !== (yj > py) && px < (xj-xi) * (py-yi) / (yj-yi) + xi) hit = !hit;
    }
    return hit;
  }

  let pending = null;
  function update(ux, uy) {
    for (const z of zones) {
      let d = 0;
      if (!inside(ux, uy, z.pts)) {
        d = Infinity;
        const p = z.pts;
        for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
          const s = segDist(ux, uy, p[j][0], p[j][1], p[i][0], p[i][1]);
          if (s < d) d = s;
        }
      }
      let near = 1 - d / REACH;
      near = near < 0 ? 0 : near > 1 ? 1 : near;
      near = Math.pow(near, 1.4);                // ramps up as you close in
      z.el.style.setProperty('--near', near.toFixed(3));
      z.el.classList.toggle('near', near > 0.02);
    }
  }


  // raise the hovered zone to the top of the stack (under the labels), holding it still for a frame so the lift still animates
  const labelsEl = document.getElementById('labels');
  for (const z of zones) {
    z.el.addEventListener('pointerenter', () => {
      if (z.el.nextElementSibling === labelsEl) return;
      z.el.classList.add('hold');
      svg.insertBefore(z.el, labelsEl);
      requestAnimationFrame(() => requestAnimationFrame(() => z.el.classList.remove('hold')));
    });
  }
  // size each name's plaque from its text
  for (const l of document.querySelectorAll('.label')) {
    const b = l.querySelector('text').getBBox(), e = l.querySelector('.plaque');
    e.setAttribute('cx', b.x + b.width/2); e.setAttribute('cy', b.y + b.height/2);
    e.setAttribute('rx', b.width/2 + 34); e.setAttribute('ry', b.height/2 + 22);
  }

  // where a zone leads: click or Enter opens it. Zones without a destination stay as they were.
  const LINKS = {"faerieland": "faerieland.html", "walkways": "intermaze.html"};
  for (const [id, href] of Object.entries(LINKS)) {
    const el = document.getElementById(id);
    el.classList.add('linked');
    const go = () => { location.href = href; };
    el.addEventListener('click', go);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  }

  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const ux = (e.clientX - r.left) / r.width  * 1388;
    const uy = (e.clientY - r.top)  / r.height * 2048;
    if (pending) cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => update(ux, uy));
  });
  svg.addEventListener('pointerleave', () => {
    for (const z of zones) {
      z.el.style.setProperty('--near', 0);
      z.el.classList.remove('near');
    }
  });
})();
</script>
  <script src="../site.js"></script>
  <script src="milestone.js"></script>
</body>
</html>
