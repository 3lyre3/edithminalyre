  :root {
    --bone:      #E3DAC9;
    --ink-red:   166, 34, 39;   /* the red of the credit line — the fill */
    --glow-red:  214, 66, 58;   /* a half-step hotter, so the halo reads as light */
    --track:     0.30em;        /* a little tighter than the plates: mixed case */
    --stretch:   1.3;           /* vertical stretch; horizontal spacing untouched */
    --cap-shift: 0.068em;
    --tilt:      0deg;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 2.4vmin;
    display: grid;
    place-items: center;
    background: #161D1E;
    background-image: radial-gradient(ellipse 78% 68% at 50% 44%,
                        #27312F 0%, #1B2324 52%, #101516 100%);
  }

  /* The square from the sketch. No drawing yet, so it holds its own
     shape; drop an <img> in and swap aspect-ratio for the image's. */
  .plate {
    position: relative;
    container-type: inline-size;
    width: min(100%, calc(100dvh - 4.8vmin));
    aspect-ratio: 1 / 1;
    box-shadow: 0 2.2vmin 5.5vmin rgba(0, 0, 0, .55),
                0 0.3vmin 1.2vmin rgba(0, 0, 0, .40);
  }

  /* the pencilled frame — four strokes that overshoot the corners,
     the way the sketch's do */
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    stroke: var(--bone);
    stroke-opacity: .30;
    stroke-width: 1.4;
    stroke-linecap: round;
    fill: none;
  }

  .word {
    position: absolute;
    left: var(--x);
    top: var(--y);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.05em;
    font-family: "Plate Mincho", Georgia, "Times New Roman", serif;
    font-size: 7.2cqw;
    line-height: 1;
    letter-spacing: var(--track);
    color: var(--bone);
    text-decoration: none;
    white-space: nowrap;
    outline: none;
    transform-origin: 50% 50%;
    transform: translate(-50%, -50%)
               translateY(calc(-1 * var(--cap-shift) * var(--stretch)))
               rotate(var(--tilt))
               scaleY(var(--stretch));
    transition: transform 480ms cubic-bezier(.22, .68, .2, 1),
                color 480ms ease-out,
                text-shadow 480ms ease-out;
  }
  .word > span { margin-right: calc(-1 * var(--track)); }  /* discount the trailing space */
  .word .big { font-size: 1.9em; margin-top: 0.08em; }

  .word:hover,
  .word:focus-visible {
    color: rgb(var(--ink-red));
    text-shadow:
      0 0 0.05em rgba(var(--glow-red), .85),
      0 0 0.16em rgba(var(--glow-red), .75),
      0 0 0.42em rgba(var(--glow-red), .45),
      0 0 0.95em rgba(var(--glow-red), .28),
      0 0 2.00em rgba(var(--glow-red), .14);   /* hotter red outward: on dark ground
                                                   the plates' ink-red halo reads as a bruise */
    transform: translate(-50%, -50%)
               translateY(calc(-1 * var(--cap-shift) * var(--stretch)))
               rotate(var(--tilt))
               scale(1.055)
               scaleY(var(--stretch));
  }

  /* ── Come with me: set the way the sketch is — "Come" big, "with"
        small and tucked in at its heel, "me" on its own line below;
        no tall stretch, a lean to the left, and it perks up on hover ── */
  .word--come {
    --stretch: 1.04;
    --track:   0.11em;
    --tilt:    -5deg;
    font-size: 8.2cqw;           /* a touch larger: it gives up the stretch, so it needs the width */
    align-items: flex-start;
    gap: 0;
  }
  .word--come:hover, .word--come:focus-visible { --tilt: -1.5deg; }
  .word--come .l1 { display: flex; align-items: baseline; }
  .word--come .with {
    font-size: 0.6em;
    letter-spacing: 0.07em;
    margin-left: 0.5em;
    position: relative;
    top: 0.08em;
    transform: rotate(3deg);
  }
  .word--come .l2 {
    font-size: 0.9em;
    margin-left: 1.45em;
    margin-top: 0.1em;
  }

  /* ── Go with E: "Go with" on one line, the E large beneath the Go ── */
  .word--go { align-items: flex-start; }
  .word--go .big { margin-left: 0.28em; margin-top: 0.06em; }

  /* ── back, top right: bone at rest, the same red when touched ── */
  .back {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 10;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    line-height: 1;
    padding: 10px 12px;
    color: rgba(227, 218, 201, 0.7);
    text-decoration: none;
    outline: none;
    transition: color 480ms ease-out, text-shadow 480ms ease-out;
  }
  .back:hover, .back:focus-visible {
    color: rgb(var(--ink-red));
    text-shadow: 0 0 0.16em rgba(var(--glow-red), .75), 0 0 0.5em rgba(var(--glow-red), .4);
  }

  @media (prefers-reduced-motion: reduce) {
    .word, .back { transition: none; }
  }

  .word--maze { --stretch: 1.12; --track: 0.22em; font-size: 5.6cqw; gap: 0.35em; }
  .word--maze .small { font-size: 0.55em; letter-spacing: 0.3em; opacity: .8; }
  .word--enter { --stretch: 1.04; --track: 0.16em; --tilt: -3deg; font-size: 4.2cqw; }
  .word--enter:hover, .word--enter:focus-visible { --tilt: 0deg; }

  /* ── back, top right: bone at rest, the plates' red when touched ── */
  .back {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 10;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    line-height: 1;
    padding: 10px 12px;
    color: rgba(227, 218, 201, 0.7);
    text-decoration: none;
    outline: none;
    transition: color 480ms ease-out, text-shadow 480ms ease-out;
  }
  .back:hover, .back:focus-visible {
    color: rgb(166, 34, 39);
    text-shadow: 0 0 0.16em rgba(214, 66, 58, .75), 0 0 0.5em rgba(214, 66, 58, .4);
  }

  /* the shared site chrome (mounted by ../site.js) has no place on the plates */
  .theme-toggle, .cursor-glow, .wisp, .grain { display: none !important; }
</style>
