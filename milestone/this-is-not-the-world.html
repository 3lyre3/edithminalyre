  :root {
    --bone:      #E3DAC9;
    --ink-red:   166, 34, 39;   /* the red of the credit line — the fill */
    --glow-red:  214, 66, 58;   /* a half-step hotter, so the halo reads as light */
    --track:     0.42em;        /* letterspacing, as drawn */
    --stretch:   1.3;           /* vertical stretch; horizontal spacing untouched */
    --cap-shift: 0.068em;       /* puts cap-height centre on the target line */
    --plate-w:   1379;
    --plate-h:   2048;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 2.4vmin;
    display: grid;
    place-items: center;
    background: #161D1E;
    background-image: radial-gradient(ellipse 78% 68% at 50% 44%,
                        #27312F 0%, #1B2324 52%, #101516 100%);
  }

  .plate {
    position: relative;
    container-type: inline-size;
    width: min(100%, calc((100dvh - 4.8vmin) * var(--plate-w) / var(--plate-h)));
    box-shadow: 0 2.2vmin 5.5vmin rgba(0, 0, 0, .55),
                0 0.3vmin 1.2vmin rgba(0, 0, 0, .40);
  }

  .plate img { display: block; width: 100%; height: auto; }

  .legend {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .line {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .line--1 { top: 12.0%; }
  .line--2 { top: 36.5%; }
  .line--3 { top: 61.0%; }
  .line--4 { top: 85.5%; }

  .word {
    font-family: "Plate Mincho", serif;
    font-size: 11.4576cqw;      /* the drawing's own 158px, held proportional */
    line-height: 1;
    letter-spacing: var(--track);
    margin-right: calc(-1 * var(--track));   /* discount the trailing space */
    color: var(--bone);
    white-space: nowrap;
    transform-origin: 50% 50%;
    transform: translateY(calc(-1 * var(--cap-shift) * var(--stretch)))
               scaleY(var(--stretch));
  }

  /* the ellipsis rides at mid cap-height, mincho fashion */
  .dots { position: relative; top: -0.316em; }

  a.word { color: var(--bone); text-decoration: none; }

  .word--live {
    pointer-events: auto;
    cursor: pointer;
    outline: none;
    transition: transform 480ms cubic-bezier(.22, .68, .2, 1),
                color 480ms ease-out,
                text-shadow 480ms ease-out;
  }

  /* hovering any live word lights every live word */
  .legend:has(.word--live:hover) .word--live,
  .legend:has(.word--live:focus-visible) .word--live {
    color: rgb(var(--ink-red));
    text-shadow:
      0 0 0.05em rgba(var(--glow-red), .85),
      0 0 0.16em rgba(var(--glow-red), .75),
      0 0 0.42em rgba(var(--ink-red),  .60),
      0 0 0.95em rgba(var(--ink-red),  .45),
      0 0 2.00em rgba(var(--ink-red),  .26);
    transform: translateY(calc(-1 * var(--cap-shift) * var(--stretch)))
               scale(1.055)
               scaleY(var(--stretch));
  }

  @media (prefers-reduced-motion: reduce) {
    .word--live { transition: none; }
  }

  /* ── back, top right: bone at rest, the plates' red when touched ── */
  .back {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 10;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    line-height: 1;
    padding: 10px 12px;
    color: rgba(227, 218, 201, 0.7);
    text-decoration: none;
    outline: none;
    transition: color 480ms ease-out, text-shadow 480ms ease-out;
  }
  .back:hover, .back:focus-visible {
    color: rgb(166, 34, 39);
    text-shadow: 0 0 0.16em rgba(214, 66, 58, .75), 0 0 0.5em rgba(214, 66, 58, .4);
  }

  /* the shared site chrome (mounted by ../site.js) has no place on the plates */
  .theme-toggle, .cursor-glow, .wisp, .grain { display: none !important; }
